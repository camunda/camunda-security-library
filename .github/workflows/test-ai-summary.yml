name: Test AI Release Summary

on:
  push:
    branches:
      - improve_release_text
  workflow_dispatch:
    inputs:
      sourceRelease:
        description: 'Release tag to fetch notes from (e.g., 0.1.0-alpha3)'
        type: string
        required: true
        default: '0.1.0-alpha3'
      dryRun:
        description: 'Dry run: test only, do not update any release'
        type: boolean
        default: true

env:
  GH_TOKEN: ${{ github.token }}
  # Default values for push triggers (inputs are only available on workflow_dispatch)
  DEFAULT_SOURCE_RELEASE: '0.1.0-alpha3'
  DEFAULT_DRY_RUN: 'false'  # When pushed: actually update the release

jobs:
  test-ai-summary:
    name: Test AI Release Summary Generation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # Required to edit releases
      # Required for GitHub Models API access
      # See: https://docs.github.com/en/github-models/prototyping-with-ai-models
      id-token: write
      models: read

    steps:
      - name: Output Inputs
        run: |
          echo "Source Release: ${{ inputs.sourceRelease }}"
          echo "Dry Run: ${{ inputs.dryRun }}"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Diagnostic Check
        run: |
          echo "============================================"
          echo "DIAGNOSTIC CHECKS"
          echo "============================================"
          echo ""
          echo "ℹ Trigger Info:"
          echo "  - Event: ${{ github.event_name }}"
          echo "  - Source Release Input: ${{ inputs.sourceRelease || '(not available for push trigger)' }}"
          echo "  - Dry Run Input: ${{ inputs.dryRun || '(not available for push trigger)' }}"
          echo "  - Will use: sourceRelease=${DEFAULT_SOURCE_RELEASE}, dryRun=${DEFAULT_DRY_RUN}"
          if [[ "${DEFAULT_DRY_RUN}" == "false" ]]; then
            echo "  ⚠️  WARNING: Release will be updated! (dryRun=false)"
          fi
          echo ""
          echo "✓ Workflow Permissions:"
          echo "  - contents: write (required to edit releases)"
          echo "  - id-token: write"
          echo "  - models: read (required for GitHub Models API)"
          echo ""
          echo "✓ Environment Variables:"
          echo "  - GH_TOKEN: $([[ -n "$GH_TOKEN" ]] && echo "SET" || echo "NOT SET")"
          echo ""
          echo "✓ GitHub CLI Available:"
          which gh && echo "  - gh CLI found at: $(which gh)"
          echo ""
          echo "✓ Python Version:"
          python3 --version
          echo ""
          echo "Next: Testing API accessibility..."
          echo ""

      - name: Test AI Release Summary
        run: |
          python3 - <<'EOF'
          import json, os, subprocess, sys, tempfile, urllib.request, urllib.error

          # Use inputs if available (workflow_dispatch), otherwise fall back to env defaults (push trigger)
          # When triggered by push, ${{ inputs.sourceRelease }} evaluates to empty string
          source_release = "${{ inputs.sourceRelease }}" or os.environ.get("DEFAULT_SOURCE_RELEASE", "0.1.0-alpha3")
          dry_run_str = "${{ inputs.dryRun }}" or os.environ.get("DEFAULT_DRY_RUN", "true")
          
          # Parse the dry_run value
          dry_run = dry_run_str.lower() in ("true", "yes", "1")
          
          repo   = os.environ["GITHUB_REPOSITORY"]
          token  = os.environ.get("GH_TOKEN") or os.environ.get("GITHUB_TOKEN")

          if not token:
              print("ERROR: no GitHub token found")
              sys.exit(1)

          print(f"Configuration:")
          print(f"  Source Release: {source_release}")
          print(f"  Dry Run: {dry_run}")
          print(f"  Repository: {repo}")
          print("")

          try:
              print(f"Fetching release notes from {source_release}...")
              # Fetch the auto-generated notes from the source release
              result = subprocess.run(
                  ["gh", "release", "view", source_release, "--repo", repo,
                   "--json", "body", "--jq", ".body"],
                  capture_output=True, text=True, check=True,
              )
              notes = result.stdout.strip()
              if not notes:
                  print("ERROR: No release notes found for the source release")
                  sys.exit(1)

              print(f"\n{'='*60}")
              print("FETCHED RELEASE NOTES:")
              print(f"{'='*60}\n")
              print(notes[:500] + ("..." if len(notes) > 500 else ""))
              print(f"\n(Total length: {len(notes)} characters)")

              print(f"\n{'='*60}")
              print("CALLING GITHUB MODELS API...")
              print(f"{'='*60}\n")

              payload = {
                  "model": "gpt-4o-mini",
                  "messages": [
                      {
                          "role": "system",
                          "content": (
                              "You are a technical writer creating release notes for the Camunda Security Library, "
                              "a Java 21 / Spring Boot hexagonal security library. "
                              "Given a raw list of commits or PR titles, produce concise, structured release notes with: "
                              "a one-short-paragraph executive summary, then bullet-point sections titled "
                              "Breaking Changes (omit entirely if none), New Features, Bug Fixes, and Improvements. "
                              "Be precise and developer-friendly. Do not invent details not present in the input."
                          ),
                      },
                      {
                          "role": "user",
                          "content": f"Generate release notes for version {source_release}:\n\n{notes[:4000]}",
                      },
                  ],
                  "max_tokens": 1000,
              }

              print("Request payload:")
              print(f"  Model: {payload['model']}")
              print(f"  Max tokens: {payload['max_tokens']}")
              print(f"  System message: {len(payload['messages'][0]['content'])} chars")
              print(f"  User message: {len(payload['messages'][1]['content'])} chars")

              req = urllib.request.Request(
                  "https://models.inference.ai.azure.com/chat/completions",
                  data=json.dumps(payload).encode(),
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                  },
              )

              print("\nSending request to GitHub Models API...")
              with urllib.request.urlopen(req, timeout=30) as resp:
                  data = json.loads(resp.read())

              if "choices" not in data or len(data["choices"]) == 0:
                  print(f"ERROR: Unexpected API response: {data}")
                  sys.exit(1)

              summary = data["choices"][0]["message"]["content"]

              print(f"\n{'='*60}")
              print("AI-GENERATED SUMMARY:")
              print(f"{'='*60}\n")
              print(summary)

              new_body = (
                  f"## What's new in {source_release}\n\n"
                  f"{summary}\n\n"
                  f"---\n\n"
                  f"## Full Changelog\n\n"
                  f"{notes}"
              )

              print(f"\n{'='*60}")
              print("FINAL RELEASE NOTES (preview):")
              print(f"{'='*60}\n")
              print(new_body[:800] + "\n\n[... truncated for preview ...]")

              if dry_run:
                  print(f"\n{'='*60}")
                  print("DRY RUN - Not updating any release")
                  print(f"{'='*60}\n")
                  print("✓ Test completed successfully!")
                  print("To apply this to a real release, set dryRun to false")
                  sys.exit(0)

              # Write to a temp file to avoid command-line length limits.
              with tempfile.NamedTemporaryFile(mode="w", suffix=".md", delete=False) as tmp:
                  tmp.write(new_body)
                  tmp_path = tmp.name

              try:
                  print(f"\n{'='*60}")
                  print(f"UPDATING {source_release} release notes...")
                  print(f"{'='*60}\n")
                  subprocess.run(
                      ["gh", "release", "edit", source_release, "--repo", repo, "--notes-file", tmp_path],
                      check=True,
                  )
                  print("✓ Release notes updated successfully!")
              finally:
                  os.unlink(tmp_path)

          except urllib.error.HTTPError as e:
              print(f"\nHTTP Error {e.code}: {e.reason}")
              print(f"URL: {e.url}")
              if e.code == 401:
                  print("\nPossible causes:")
                  print("  1. GitHub token does not have required permissions for GitHub Models API")
                  print("  2. GitHub Models API is not enabled for this repository")
                  print("  3. The token has expired or is invalid")
              print("\nResponse body:")
              try:
                  print(e.read().decode())
              except:
                  pass
              sys.exit(1)
          except Exception as exc:
              print(f"\nERROR: {type(exc).__name__}: {exc}")
              import traceback
              traceback.print_exc()
              sys.exit(1)
          EOF

      - name: Summary
        if: always()
        run: |
          echo "## Test completed ✓"
          if [[ "${DEFAULT_DRY_RUN}" == "false" ]]; then
            echo "Release notes have been updated with AI-generated summary."
            echo "Go to: https://github.com/${{ github.repository }}/releases/tag/${DEFAULT_SOURCE_RELEASE}"
          else
            echo "Dry run completed. To apply changes to a real release, set dryRun to false in workflow_dispatch."
          fi

