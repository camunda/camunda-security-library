name: build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    name: Maven verify (unit + integration tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check ADR numbering is unique
        run: |
          adr_dupes() { ls "$1"/*.md | sed 's|.*/0*\([0-9][0-9]*\)-.*|\1|' | sort | uniq -d; }

          # Self-test first: an earlier version of this check used a GNU-sed-only
          # regex that was silently vacuous on BSD sed (matched nothing, never
          # failed). Prove the check can actually detect a duplicate before
          # trusting it against the real docs/adr/ tree. Sharing adr_dupes()
          # between the self-test and the real check keeps them in sync by
          # construction — a fix to one can't silently leave the other untested.
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          touch "$tmp/0001-a.md" "$tmp/0001-b.md"
          selftest_dupes=$(adr_dupes "$tmp")
          if [ -z "$selftest_dupes" ]; then
            echo "::error::ADR duplicate-number self-test failed to detect a synthetic duplicate — the check itself is broken (silently vacuous), fix it before relying on the result below"
            exit 1
          fi

          dupes=$(adr_dupes docs/adr)
          if [ -n "$dupes" ]; then echo "::error::Duplicate ADR numbers: $dupes"; exit 1; fi

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify (compile, unit tests, integration tests)
        run: ./mvnw --batch-mode --no-transfer-progress -T 1C clean verify

  deploy-snapshot:
    name: Deploy SNAPSHOT to Camunda Artifactory
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-snapshot-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Create Maven settings.xml
        uses: ./.github/actions/create-maven-setting-file
        with:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_ROLE_ID: ${{ secrets.VAULT_ROLE_ID }}
          VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}

      - name: Deploy SNAPSHOT
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests deploy
