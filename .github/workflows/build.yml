name: build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    name: Maven verify (unit + integration tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check ADR numbering is unique
        run: |
          adr_dupes() { ls "$1"/*.md | sed 's|.*/0*\([0-9][0-9]*\)-.*|\1|' | sort | uniq -d; }

          # Self-test first: an earlier version of this check used a GNU-sed-only
          # regex that was silently vacuous on BSD sed (matched nothing, never
          # failed). Prove the check can actually detect a duplicate before
          # trusting it against the real docs/adr/ tree. Sharing adr_dupes()
          # between the self-test and the real check keeps them in sync by
          # construction — a fix to one can't silently leave the other untested.
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          touch "$tmp/0001-a.md" "$tmp/0001-b.md"
          selftest_dupes=$(adr_dupes "$tmp")
          if [ -z "$selftest_dupes" ]; then
            echo "::error::ADR duplicate-number self-test failed to detect a synthetic duplicate — the check itself is broken (silently vacuous), fix it before relying on the result below"
            exit 1
          fi

          dupes=$(adr_dupes docs/adr)
          if [ -n "$dupes" ]; then echo "::error::Duplicate ADR numbers: $dupes"; exit 1; fi

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21.0.12+101.0.LTS'
          cache: maven

      - name: Verify (compile, unit tests, integration tests)
        run: ./mvnw --batch-mode --no-transfer-progress -T 1C clean verify

  deploy-snapshot:
    name: Deploy SNAPSHOT to Camunda Artifactory
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write  # mint GitHub OIDC token for Vault JWT auth
    concurrency:
      group: deploy-snapshot-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21.0.12+101.0.LTS'
          cache: maven

      - name: Create Maven settings.xml
        uses: ./.github/actions/create-maven-setting-file
        with:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_JWT_ROLE: ${{ secrets.VAULT_JWT_ROLE }}
          VAULT_JWT_PATH: ${{ secrets.VAULT_JWT_PATH }}
          VAULT_JWT_AUDIENCE: ${{ secrets.VAULT_JWT_AUDIENCE }}

      - name: Deploy SNAPSHOT
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests deploy

  # Decides whether the Gradle job has anything to check. Mirrors the `gradle-changes` filter of the
  # Camunda monorepo (camunda/camunda#52869): sources, Maven inputs, Gradle inputs, and the files the
  # Gradle build reads (license header, Checkstyle config) or that drive this job.
  changes:
    name: Detect build-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read  # paths-filter lists the PR's changed files through the API
    outputs:
      gradle: ${{ steps.filter.outputs.gradle }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            gradle:
              - '**/src/**'
              - '**/pom.xml'
              - '.mvn/wrapper/**'
              - 'mvnw'
              - '**/*.gradle.kts'
              - '**/*.gradle'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'
              - 'gradle.properties'
              - 'config/**'
              - 'COPYING-HEADER.txt'
              - '.github/workflows/build.yml'
              - '.github/scripts/**'

  # Advisory per ADR-0034: the parallel Gradle build is not required for merging and is not in any
  # `needs`. Maven (the `verify` job) remains the source of truth. Pushes always run it so the
  # default branch keeps writing the Gradle cache that pull requests read.
  gradle:
    name: Gradle build (parallel, advisory)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.gradle == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21.0.12+101.0.LTS'
          cache: maven

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Gradle build
        run: ./gradlew build

      - name: Build-logic tests (included builds are not run by the root build)
        run: ./gradlew -p gradle/build-logic check

      - name: Compare Maven and Gradle resolved dependencies
        run: python3 .github/scripts/compare-module-deps.py
