name: Feature Request
description: Request a new capability — structured for both human review and AI-assisted implementation
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Provide enough context that someone (or an AI agent) picking this up cold can understand, design, implement, and verify the feature without further conversation.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences describing what should be possible.
      placeholder: "Users should be able to assign multiple roles to a principal in a single API call"
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this needed? What problem does it solve or what workflow does it enable?
      placeholder: "Currently assigning 5 roles requires 5 separate API calls. Bulk assignment reduces round-trips and simplifies client integration."
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: Describe what the feature looks like when it works. Be specific about inputs, outputs, and side effects.
      placeholder: |
        - POST /api/principals/{id}/roles with a JSON array of role IDs
        - All roles are assigned atomically — either all succeed or none do
        - Response includes the updated list of assigned roles
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope and Boundaries
      description: What is in scope and — just as importantly — what is explicitly out of scope?
      placeholder: |
        In scope:
        - Bulk role assignment for a single principal
        - Validation that all role IDs exist before assignment

        Out of scope:
        - Bulk assignment across multiple principals
        - Role creation as part of this call
    validations:
      required: true

  - type: textarea
    id: location
    attributes:
      label: Location in Code
      description: Where should this be implemented? Relevant modules, packages, existing classes to extend or follow as patterns.
      placeholder: |
        - New use case port: `core/src/.../port/in/AssignRolesPort.java`
        - Domain service: `core/src/.../RoleAssignmentService.java`
        - API contract or DTOs: `api/src/...`
        - REST adapter: `spring-boot-starter/src/.../RoleRestAdapter.java` (extend existing)
        - If there is an existing domain-layer service with a similar responsibility, reference it here as the pattern to follow
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: What must be true for this to be considered complete? Be specific — these are the verification checks.
      placeholder: |
        - [ ] Bulk role assignment endpoint accepts an array of role IDs and assigns all atomically
        - [ ] Invalid role IDs return 400 with a clear error listing which IDs were not found
        - [ ] Unit tests cover the domain service (happy path, partial invalid input, empty input)
        - [ ] Contract test covers the new endpoint
        - [ ] Existing single-role assignment behavior is unchanged
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Anything else — related ADRs, deployment strategy considerations, links to related issues, design sketches.
    validations:
      required: false
