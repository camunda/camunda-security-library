name: Task
description: A small, self-contained unit of implementation work — standalone or part of a feature
type: Task
body:
  - type: markdown
    attributes:
      value: |
        A task is a concrete, independently mergeable unit of work. It can stand alone, or it can be one of several tasks that together deliver a feature.

        Each task must be small enough to review in one sitting and safe to merge on its own — either because it stands alone, or because it lands behind a boundary (no caller yet, feature flag, internal only, additive change) until the parent feature is complete.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences describing what this task delivers.
      placeholder: "Add the PolicyVersionRepository port and a JPA adapter implementation"
    validations:
      required: true

  - type: textarea
    id: parent-feature
    attributes:
      label: Parent Feature
      description: Link to the parent feature issue, if any. Leave as-is if this is a standalone task.
      placeholder: "Parent: #42 — Policy versioning in Hub"
      value: "Standalone task — no parent feature."
    validations:
      required: true

  - type: textarea
    id: independently-mergeable
    attributes:
      label: Why This Is Independently Mergeable
      description: Explain the boundary that makes merging this alone safe — no caller yet, feature flag, internal only, additive change, etc.
      placeholder: "The port interface has no callers yet. Merging it alone adds new code without changing any existing behavior."
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is in scope and what is explicitly out of scope for this task.
      placeholder: |
        In scope:
        - Define `PolicyVersionRepository` port in `sgl-domain/src/.../port/out/`
        - Implement `JpaPolicyVersionPersistenceAdapter` in `sgl-spring/src/.../adapter/out/`
        - Unit tests for the adapter

        Out of scope:
        - Wiring the adapter into any service (follow-up task)
        - Domain service changes (follow-up task)
    validations:
      required: true

  - type: textarea
    id: location
    attributes:
      label: Location in Code
      description: Where to implement. Specific file paths, modules, new files. Existing classes to follow as patterns — name them specifically.
      placeholder: |
        - New file: `sgl-domain/src/main/java/.../port/out/PolicyVersionRepository.java`
        - New file: `sgl-spring/src/main/java/.../adapter/out/JpaPolicyVersionPersistenceAdapter.java`
        - Follow pattern in `RolePersistenceAdapter` for the JPA adapter structure
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: What must be true for this task to be considered complete. Each criterion must be verifiable.
      placeholder: |
        - [ ] `PolicyVersionRepository` interface exists with `save(PolicyVersion)` and `findByClusterAndVersion(...)` methods
        - [ ] `JpaPolicyVersionPersistenceAdapter` implements the interface and is annotated `@Component`
        - [ ] Unit test covers save and findByClusterAndVersion happy paths
        - [ ] No existing test fails
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Exact command to run to confirm the task is complete.
      placeholder: "`mvn test -pl sgl-spring -Dtest=JpaPolicyVersionPersistenceAdapterTest`"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Related ADRs, sibling tasks, deployment strategy relevance, design notes.
    validations:
      required: false
