name: Bug Report
description: Report a bug — structured for both human review and AI-assisted resolution
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Provide enough context that someone (or an AI agent) picking this up cold can understand, locate, reproduce, and fix the issue without further conversation.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences describing what is broken.
      placeholder: "PolicySnapshot apply silently drops authorizations with PHYSICAL_TENANT scope type"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen?
      placeholder: "All authorizations in the snapshot — including PHYSICAL_TENANT-scoped ones — should be persisted and queryable after apply."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What happens instead?
      placeholder: "PHYSICAL_TENANT-scoped authorizations are silently skipped during apply. No error is logged. The policy projection is incomplete."
    validations:
      required: true

  - type: textarea
    id: location
    attributes:
      label: Location in Code
      description: Where in the codebase does this occur? File paths, class names, method names — as specific as possible.
      placeholder: |
        - `core/pom.xml` — module where the persistence/apply implementation lives
        - `api/pom.xml` — module defining shared API/domain types involved in the bug
        - `spring-boot-starter/src/main/resources/` — starter configuration or auto-configuration resources related to the issue
    validations:
      required: false

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How to trigger the bug. Include test setup, API calls, or configuration if relevant.
      placeholder: |
        1. Create a PolicySnapshot containing an authorization with scope_type=PHYSICAL_TENANT
        2. Call PolicyApplyService.applySnapshot(snapshot)
        3. Query authorizations — PHYSICAL_TENANT-scoped entry is missing
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: What must be true for this to be considered fixed? Be specific — these are the verification checks.
      placeholder: |
        - [ ] Authorizations with all scope types (ALL, TENANT, PHYSICAL_TENANT) are persisted during snapshot apply
        - [ ] A unit test covers each scope type through the apply path
        - [ ] No silent data loss — if an authorization cannot be applied, an error is logged
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Anything else — related ADRs, deployment strategy, screenshots, logs, links to related issues.
    validations:
      required: false
