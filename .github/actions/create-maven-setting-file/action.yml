name: Create Maven settings.xml file
description: "Create Maven settings.xml file (requires VAULT_ADDR, VAULT_JWT_ROLE, VAULT_JWT_PATH, VAULT_JWT_AUDIENCE inputs; the calling job must grant id-token: write)"
inputs:
  VAULT_ADDR:
    description: Vault address
    required: true
  VAULT_JWT_ROLE:
    description: Vault JWT role
    required: true
  VAULT_JWT_PATH:
    description: Vault JWT auth mount path
    required: true
  VAULT_JWT_AUDIENCE:
    description: Vault JWT audience
    required: true
  MAVEN_CENTRAL_DEPLOYMENT_USR:
    description: Maven Central deployment username (optional, only needed for publishing to Central)
    required: false
    default: ''
  MAVEN_CENTRAL_DEPLOYMENT_PSW:
    description: Maven Central deployment password (optional, only needed for publishing to Central)
    required: false
    default: ''
runs:
  using: "composite"
  steps:
    - name: Import Nexus Secrets
      id: nexus-secrets
      uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
      with:
        url: ${{ inputs.VAULT_ADDR }}
        method: jwt
        role: ${{ inputs.VAULT_JWT_ROLE }}
        path: ${{ inputs.VAULT_JWT_PATH }}
        jwtGithubAudience: ${{ inputs.VAULT_JWT_AUDIENCE }}
        exportEnv: false # we rely on step outputs, no need for environment variables
        secrets: |
          secret/data/github.com/organizations/camunda NEXUS_USR;
          secret/data/github.com/organizations/camunda NEXUS_PSW;

    # Build the servers list, conditionally including Maven Central credentials
    - name: 'Build servers list'
      id: build-servers
      shell: bash
      run: |
        SERVERS='[
          {"id":"camunda-nexus","username":"${{ steps.nexus-secrets.outputs.NEXUS_USR }}","password":"${{ steps.nexus-secrets.outputs.NEXUS_PSW }}"},
          {"id":"nexus-snapshots","username":"${{ steps.nexus-secrets.outputs.NEXUS_USR }}","password":"${{ steps.nexus-secrets.outputs.NEXUS_PSW }}"},
          {"id":"nexus","username":"${{ steps.nexus-secrets.outputs.NEXUS_USR }}","password":"${{ steps.nexus-secrets.outputs.NEXUS_PSW }}"}'

        if [ -n "${{ inputs.MAVEN_CENTRAL_DEPLOYMENT_USR }}" ]; then
          SERVERS="${SERVERS}"',
          {"id":"central","username":"${{ inputs.MAVEN_CENTRAL_DEPLOYMENT_USR }}","password":"${{ inputs.MAVEN_CENTRAL_DEPLOYMENT_PSW }}"}'
        fi

        SERVERS="${SERVERS}]"
        echo "servers<<EOF" >> "$GITHUB_OUTPUT"
        echo "$SERVERS" >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"

    # Use CI Nexus as co-located pull-through cache for Maven artifacts via ~/.m2/settings.xml
    - name: 'Create settings.xml'
      uses: s4u/maven-settings-action@894661b3ddae382f1ae8edbeab60987e08cf0788 # v4.0.0
      with:
        githubServer: false
        servers: ${{ steps.build-servers.outputs.servers }}
        mirrors: |
          [{"url": "https://repository.nexus.camunda.cloud/content/groups/internal/", "id": "camunda-nexus", "mirrorOf": "*,!central,!confluent,!shibboleth", "name": "Camunda Nexus"},
          {"url": "https://repository.nexus.camunda.cloud/content/groups/internal/", "id": "nexus-snapshots", "mirrorOf": "nexus-snapshots", "name": "Nexus Snapshot"},
          {"url": "https://repository.nexus.camunda.cloud/content/groups/internal/", "id": "nexus", "mirrorOf": "nexus", "name": "Nexus"}]
