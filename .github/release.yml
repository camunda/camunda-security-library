# Configuration for GitHub's automatically generated release notes.
# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
changelog:
  exclude:
    authors:
      # The "merge back X into main" PRs are authored by the github-actions app.
      # Both login forms are listed, because the docs do not say which one matches a bot.
      - github-actions
      - github-actions[bot]
