<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in to Camunda</title>
<style>
:root{--background:#fafafa;--foreground:#18181b;--border:rgba(161,161,170,.2);--popover:#fff;--popover-foreground:#18181b;--muted-foreground:#71717a;--accent-action-default:#c2410c;--ring:#ea580c;--radius-md:.375rem;--radius-lg:.5rem}
@media(prefers-color-scheme:dark){:root{--background:#09090b;--foreground:#fafafa;--border:rgba(255,255,255,.16);--popover:#27272a;--popover-foreground:#fafafa;--muted-foreground:#a1a1aa;--accent-action-default:#fb923c;--ring:#fb923c}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--background);color:var(--foreground);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:2rem 1rem}
.frame{width:100%;max-width:26rem;display:flex;flex-direction:column;gap:1.25rem}
.card{background:var(--popover);color:var(--popover-foreground);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);padding:1.5rem;display:flex;flex-direction:column;gap:1rem}
.logo{display:flex;justify-content:center;padding-top:.5rem;color:var(--foreground)}
.logo svg{display:block;height:2rem;width:auto;fill:currentColor}
h1{margin:0 0 .5rem;padding-bottom:.5rem;font-size:1.25rem;line-height:1.4;font-weight:600;letter-spacing:-.01em;text-align:center}
.subtitle{margin:-.75rem 0 .25rem;text-align:center;font-size:.875rem;color:var(--muted-foreground)}
.providers{display:flex;flex-direction:column;gap:.5rem}
.provider{display:flex;align-items:center;gap:.75rem;width:100%;height:2.75rem;padding:0 .875rem;background:var(--popover);border:1px solid var(--border);border-radius:var(--radius-md);color:var(--popover-foreground);font-family:inherit;font-size:.875rem;font-weight:500;text-align:left;text-decoration:none;cursor:pointer;transition:border-color 120ms ease}
.provider:hover{border-color:var(--accent-action-default)}
.provider:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.provider-name{flex:1}
.provider-arrow{flex:none;color:var(--muted-foreground)}
footer{text-align:center;font-size:.75rem;color:var(--muted-foreground)}
</style>
</head>
<body>
<div class="frame">
<div class="card">
<div class="logo" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="96" height="33" viewBox="0 0 96 33" role="img" aria-label="Camunda"><path fill-rule="evenodd" d="M96 26.907V33H0v-6.093zM43.826.296l3.602.003-.015 17.744c-.002 1.643.718 2.235 1.864 2.236s1.867-.59 1.869-2.233L51.16.302l3.405.003-.015 17.514c-.003 3.68-1.838 5.782-5.375 5.779s-5.368-2.108-5.365-5.788zM5.385 0c3.537.003 5.368 2.108 5.365 5.788l-.002 2.234-3.405-.003.002-2.464c.001-1.643-.718-2.268-1.865-2.269-1.146 0-1.866.623-1.868 2.266l-.01 12.42c-.002 1.644.718 2.236 1.864 2.237s1.867-.59 1.869-2.233l.002-3.286 3.406.003-.003 3.056c-.003 3.68-1.838 5.782-5.375 5.779S-.003 21.42 0 17.74L.01 5.779C.013 2.099 1.85-.003 5.385 0M87.08.332l5.272.005L96 23.342l-3.635-.003-.619-4.174-4.42-.004-.625 4.173-3.308-.003zM71.003.32 76.7.324c3.601.003 5.368 2.009 5.365 5.69l-.01 11.632c-.003 3.68-1.773 5.683-5.375 5.68l-5.698-.006zM56.989.307l4.519.004 3.688 13.771.011-13.768 3.21.003-.02 23.001-3.7-.003-4.472-16.663-.014 16.66-3.242-.003zM26.242.281l5.01.004 2.639 16.333L36.36.29l5.01.005-.02 23.001-3.405-.002.013-16.496-2.502 16.494-3.406-.003-2.67-16.268-.014 16.265-3.144-.003zM15.666.27l5.272.005 3.648 23.005-3.635-.003-.618-4.174-4.42-.003-.627 4.172-3.307-.003zm58.936 3.337-.014 16.43 2.03.002c1.146 0 1.834-.59 1.836-2.233l.01-11.961c.001-1.643-.686-2.235-1.832-2.236zm14.93.801L87.788 16.04l3.471.003zm-71.414-.06-1.745 11.63 3.471.003z"/></svg></div>
<h1>Sign in to Camunda</h1>
<p class="subtitle">Choose an identity provider to continue.</p>
<div class="providers">
{{providers}}</div>
</div>
<footer>&copy; Camunda Services GmbH, {{year}}. All rights reserved.</footer>
</div>
</body>
</html>
